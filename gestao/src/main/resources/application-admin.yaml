# =========================
# Configurações comuns (sempre carregadas)
# =========================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:seu-email@example.com}
    password: ${SPRING_MAIL_PASSWORD:sua-senha}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:TridonJ}
    api-key: ${CLOUDINARY_API_KEY:344387927618419}
    api-secret: ${CLOUDINARY_API_SECRET:9fXOuROqwoxx2wlObPaPwKQBzuo}

  cache:
    type: redis
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      time-to-live: 3600000

jwt:
  security:
    token:
      secret: ${JWT_SECURITY_TOKEN_SECRET:eununcatetrai}
      expiration: ${JWT_SECURITY_TOKEN_EXPIRATION:86400000}
      refresh-expiration: ${JWT_SECURITY_TOKEN_REFRESH_EXPIRATION:2592000000}
      issuer: ${JWT_SECURITY_TOKEN_ISSUER:api-restaurante}
    whitelist:
      - "/api/auth/**"
      - "/api/public/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-resources/**"
  version: 1.0.0
  pagination:
    default-page-size: 10
    max-page-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  exposed-headers:
    - "Authorization"
    - "X-Total-Count"
    - "Content-Disposition"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    gsinfo.restaurante: DEBUG
  file:
    name: logs/restaurante-api.log
    max-history: 30
    max-size: 10MB

server:
  port: ${SERVER_PORT:8084}
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

