cache:
  type: redis
  redis:
    host: localhost
    port: 6379
    time-to-live: 3600000

jwt:
  security:
    token:
      secret: eununcatetrai
      expiration: 86400000
      refresh-expiration: 2592000000
      issuer: api-restaurante
    whitelist:
      - "/api/auth/**"
      - "/api/public/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
  version: 1.0.0
  pagination:
    default-page-size: 10
    max-page-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  exposed-headers:
    - "Authorization"
    - "X-Total-Count"
    - "Content-Disposition"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    gsinfo.restaurante: DEBUG
  file:
    name: logs/restaurante-api.log
    max-history: 30
    max-size: 10MB

server:
  port: 8084
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

