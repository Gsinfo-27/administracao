
spring:
  application:
    name: api-restaurante

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 60000

# =====================================================
# TWILIO
# =====================================================

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

# =====================================================
# CLOUDINARY
# =====================================================

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# =====================================================
# SENDGRID
# =====================================================

sendgrid:
  api-key: ${SENDGRID_API_KEY}

# =====================================================
# JWT
# =====================================================

jwt:
  security:
    token:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}
      issuer: ${JWT_ISSUER:api-restaurante}

    whitelist:
      - "/api/auth/**"
      - "/api/public/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"

  version: 1.0.0

  pagination:
    default-page-size: 10
    max-page-size: 50

# =====================================================
# SPRINGDOC / SWAGGER
# =====================================================

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# =====================================================
# CORS
# =====================================================

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN_1:http://localhost:3000}
    - ${CORS_ALLOWED_ORIGIN_2:http://127.0.0.1:3000}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  exposed-headers:
    - "Authorization"
    - "X-Total-Count"
    - "Content-Disposition"
  allow-credentials: true
  max-age: 3600

# =====================================================
# LOGGING
# =====================================================

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    gsinfo.restaurante: DEBUG
  file:
    name: logs/restaurante-api.log

# =====================================================
# SERVER
# =====================================================

server:
  port: ${SERVER_PORT:8084}
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# =====================================================
# PROFILE: ADMIN (POSTGRESQL)
# =====================================================

---
spring:
  config:
    activate:
      on-profile: admin

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: HikariPool-POSTGRE
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      validation-timeout: 5000
      connection-init-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate   # 🔒 nunca use update em produção
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    jdbc:
      lob:
        non_contextual_creation: true
