spring:
  config:
    activate:
      on-profile: adminlocal

  datasource:
    url: jdbc:postgresql://localhost:5432/administracao
    username: postgres
    password: Bikel
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true

  mail:
    host: smtp.example.com
    port: 587
    username: seu-email@example.com
    password: sua-senha
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cache:
  type: redis
  redis:
    host: localhost
    port: 6379
    time-to-live: 3600000

jwt:
  security:
    token:
      secret: eununcatetrai
      expiration: 86400000
      refresh-expiration: 2592000000
      issuer: api-restaurante
    whitelist:
      - "/api/auth/**"
      - "/api/public/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-resources/**"
  version: 1.0.0
  pagination:
    default-page-size: 10
    max-page-size: 50

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  exposed-headers:
    - "Authorization"
    - "X-Total-Count"
    - "Content-Disposition"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    gsinfo.restaurante: DEBUG
  file:
    name: logs/restaurante-api.log
    max-history: 30
    max-size: 10MB

server:
  port: 8084
  servlet:
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true
